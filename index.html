<title>Shotday — Shot Lists & Shoot Days</title>
<style>
:root{--bg:#0e0f11;--s1:#16171a;--s2:#1c1d21;--s3:#26272d;--line:#2d2f35;--tx:#eef0f3;--mut:#8d929c;--dim:#5b5f68;--acc:#ff9f0a;--grn:#30d158;--red:#ff453a;--blu:#0a84ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s3);border:1px solid transparent;border-radius:8px;padding:7px 9px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:#2b2c32}
input[type=time],input[type=date]{color-scheme:dark}
textarea{resize:vertical;width:100%}
.ic{flex:none;display:block}
.sp{flex:1}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;background:rgba(22,23,26,.94);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.01em;padding-left:4px}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(145deg,#ffb340,#ff7a00);display:grid;place-items:center;color:#1a0f00}
.ptitle{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:7px 12px;background:var(--s3);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:#30323a}
.btn.pri{background:var(--acc);color:#1a1000}.btn.pri:hover{background:#ffb02e}
.btn.live{background:var(--grn);color:#00260b}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent;color:var(--acc)}.btn.ghost:hover{background:var(--s3)}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--acc);flex:none}
.iconbtn:hover{background:var(--s3)}
.iconbtn.sm{width:28px;height:28px}
.iconbtn.mute{color:var(--mut)}
.mob{display:none!important}

/* home */
.home{flex:1;overflow:auto;padding:28px clamp(16px,4vw,48px) 60px}
.home h1{font-size:28px;margin:0 0 18px;letter-spacing:-.02em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pcard{position:relative;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.pcard:hover{border-color:#3d4048;background:var(--s2)}
.pcard .pc-art{height:52px;border-radius:10px;margin:-4px -4px 6px;background:linear-gradient(120deg,#2a1d0a,#1a1b20 70%);display:flex;align-items:flex-end;padding:8px;gap:3px}
.pcard .pc-art i{display:block;width:6px;border-radius:2px;background:var(--acc);opacity:.75}
.pcard h3{margin:0;font-size:16px}
.pcard .meta{color:var(--mut);font-size:12px}
.pcard .pc-act{position:absolute;top:10px;right:10px;display:flex;gap:2px;opacity:0;transition:.15s}
.pcard:hover .pc-act{opacity:1}
.pcard.new{align-items:center;justify-content:center;color:var(--acc);border-style:dashed;font-weight:600}

/* project layout */
.proj{flex:1;display:flex;min-height:0}
.side{width:330px;flex:none;background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.seg{display:flex;margin:10px;background:var(--s3);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:#3a3c44;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sidehd{display:flex;align-items:center;padding:2px 10px 6px 14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.slist{flex:1;overflow:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:4px}
.sitem{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 0;border-radius:10px;cursor:pointer;position:relative}
.sitem:hover{background:var(--s2)}
.sitem.sel{background:#2a2216;box-shadow:inset 0 0 0 1px #5a4317}
.sitem .handle{width:22px}
.snum{min-width:34px;height:30px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#111}
.sbody{flex:1;min-width:0}
.sh{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ss{color:var(--mut);font-size:12px;margin-top:1px}
.dbox{width:46px;height:46px;flex:none;border-radius:10px;background:var(--s3);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-left:8px}
.dbox small{font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.06em}
.dbox b{font-size:19px;line-height:1}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);margin-right:5px;box-shadow:0 0 8px var(--grn);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.sidefoot{border-top:1px solid var(--line);padding:9px 14px;color:var(--mut);font-size:12px}
.main{flex:1;overflow:auto;min-width:0;padding:16px clamp(12px,2.2vw,28px) 90px}
.empty{color:var(--mut);text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:16px;margin-top:14px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}

/* header cards */
.hcard{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hrow .grow{flex:1;min-width:140px}
.lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.scnum{width:64px;font-weight:800;font-size:18px;text-align:center}
.dname{font-weight:700;font-size:16px}
.stats{color:var(--mut);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.stats b{color:var(--tx)}
.tbar{height:8px;background:var(--s3);border-radius:4px;overflow:hidden;position:relative}
.tbar .fill{height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.tbar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.7}
.tbar.over{box-shadow:0 0 14px rgba(255,69,58,.65)}
.tbar.over .fill{background:var(--red)}
.tlbl{font-size:12px;color:var(--mut)}
.tlbl b{color:var(--tx)}
.tlbl .bad{color:var(--red);font-weight:700}.tlbl .ok{color:var(--grn);font-weight:700}
.toolbar{display:flex;align-items:center;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.vtog{display:flex;background:var(--s3);border-radius:9px;padding:2px}
.vtog button{border:0;background:transparent;border-radius:7px;padding:5px 8px;color:var(--mut)}
.vtog button.on{background:#3a3c44;color:var(--tx)}
.daytags{display:flex;gap:5px;flex-wrap:wrap}
.daytag{font-size:11px;font-weight:600;background:rgba(255,159,10,.14);color:var(--acc);border-radius:5px;padding:2px 7px;cursor:pointer;border:0}

/* clocks */
.clocks{user-select:none;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:12px}
.clock{background:#050506;border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.clock span{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:800}
.clock b{display:block;font:700 36px/1.1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.02em;margin:2px 0}
.clock small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock.ok b{color:var(--grn)}
.clock.bad b{color:var(--red)}
.clock.bad{border-color:rgba(255,69,58,.55);box-shadow:0 0 24px rgba(255,69,58,.28)}
.clock.idle b{color:var(--tx)}
.donebtn{border:0;border-radius:14px;background:var(--grn);color:#00260b;font-weight:800;padding:0 20px;display:flex;align-items:center;gap:8px;font-size:15px}
.donebtn:hover{filter:brightness(1.08)}

/* rows */
.rows{display:flex;flex-direction:column;gap:6px}
.grp{border-radius:12px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.grp.linked{border-left:3px solid var(--acc)}
.grp.linked .row+.row{border-top:1px dashed #3a3c43}
.grp.note{background:#19160f;border-color:#3a301d}
.grp.cur{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn),0 0 26px rgba(48,209,88,.16)}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 0;min-height:58px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.025)}
.handle{width:30px;align-self:stretch;display:grid;place-items:center;color:var(--dim);cursor:grab;touch-action:none;flex:none}
.handle:hover{color:var(--mut)}
.stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--s3);flex:none}
.num{font-weight:800;font-size:17px;min-width:44px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.nicon{color:#c9a15a;display:grid;place-items:center;min-width:44px}
.thumb{width:76px;height:43px;border-radius:6px;object-fit:cover;flex:none;background:var(--s3)}
.body{flex:1;min-width:0}
.t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 b{font-weight:650}
.t1 .d{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:11px;font-weight:650;padding:2px 7px;border-radius:5px;background:var(--s3);color:#c6c9d0;letter-spacing:.01em}
.chip.sz{background:#e9eaee;color:#111}
.chip.su{background:rgba(10,132,255,.18);color:#72b6ff}
.chip.cam{background:rgba(191,90,242,.18);color:#d39af5}
.chip.gr{background:rgba(48,209,88,.13);color:#6fdc8c}
.chip.us{background:rgba(255,214,10,.14);color:#ffd60a}
.chip.warn{background:rgba(255,69,58,.16);color:#ff7b72}
.chip.okc{background:rgba(48,209,88,.15);color:#6fdc8c}
.flag{color:#ffd60a}
.lk{color:var(--acc)}
.mins{font-variant-numeric:tabular-nums;font-weight:750;color:var(--acc);min-width:48px;text-align:right}
.when{width:62px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:13px;line-height:1.15}
.when small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.when.proj{color:var(--acc)}
.when.fin{color:var(--grn)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;flex:none;background:none;padding:0;margin-left:-4px}
.chk:hover{border-color:var(--grn)}
.chk.on{background:var(--grn);border-color:var(--grn);color:#00260b}
.row.done .num,.row.done .body,.row.done .mins,.row.done .thumb{opacity:.42}
.row.done .num{text-decoration:line-through}
.ph{border:2px dashed var(--acc);border-radius:12px;opacity:.55;flex:none}
.lift{box-shadow:0 14px 44px rgba(0,0,0,.7);opacity:.95}
body.dragging{cursor:grabbing;user-select:none}

/* storyboard grid */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bcard{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.bcard:hover{border-color:#43464f}
.bimg{aspect-ratio:16/9;background:#0a0a0b;display:grid;place-items:center;color:var(--dim);position:relative}
.bimg img{width:100%;height:100%;object-fit:cover;display:block}
.bimg .bn{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);border-radius:6px;padding:2px 7px;font-weight:800;color:#fff}
.bimg .bm{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);border-radius:6px;padding:2px 7px;font-weight:700;color:var(--acc);font-size:12px}
.binfo{padding:8px 10px}
.binfo .t1{font-size:13px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:80}
.sheet{position:fixed;z-index:81;top:50%;left:50%;transform:translate(-50%,-50%);width:min(580px,95vw);max-height:92vh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .16s ease-out}
.sheet.wide{width:min(760px,95vw)}
.sheet.small{width:min(400px,95vw)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-body{overflow:auto;padding:14px 16px}
.sheet-ft{display:flex;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.mnum{min-width:48px;height:40px;padding:0 8px;border-radius:9px;background:var(--acc);color:#1a1000;display:grid;place-items:center;font-weight:900;font-size:18px}
.mt{font-weight:700;font-size:16px}
.ms{color:var(--mut);font-size:12px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;min-width:0}
.f>span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.hint{color:var(--mut);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:650;color:#d5d8de;display:inline-flex;align-items:center;gap:5px}
.pill:hover{border-color:#4a4d55}
.pill.on{background:var(--acc);border-color:var(--acc);color:#1a1000}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--s1) inset}
.sw .none{background:var(--s3);color:var(--mut);display:grid;place-items:center}
.minsed{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.minsed input{width:72px;text-align:center;font-weight:800;font-size:16px}
.board{width:100%;border-radius:10px;margin-bottom:8px;display:block;max-height:300px;object-fit:contain;background:#000}
.togs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tog{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px}
.tog input{accent-color:var(--acc);width:16px;height:16px}
.sec{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:6px 0 10px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.lists textarea{height:130px;font-size:12px}
.menu{display:flex;flex-direction:column;gap:4px}
.mi{display:flex;align-items:center;gap:12px;border:0;background:var(--s2);border-radius:11px;padding:11px 12px;text-align:left}
.mi:hover{background:var(--s3)}
.mi .ico{width:34px;height:34px;border-radius:9px;background:var(--s3);display:grid;place-items:center;color:var(--acc);flex:none}
.mi b{display:block;font-size:14px}
.mi small{color:var(--mut)}
.strip-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
.strip-item{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2d33;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 16px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1}

.syncpill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.syncpill.ok{color:var(--tx)}.syncpill.ok i{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.syncpill.wait i{background:var(--acc);animation:pulse 1s infinite}
.syncpill.bad{color:#ff8a80;border-color:rgba(255,69,58,.4)}.syncpill.bad i{background:var(--red)}
.tagdev{font-size:10px;font-weight:700;color:var(--mut);background:var(--s3);border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.linkrow{display:flex;gap:6px}.linkrow input{flex:1;font-size:12px;color:var(--mut)}
.ro .handle{visibility:hidden}
.ro .chk,.ro [data-b]:not([data-b^="g:"]){pointer-events:none}
.ro [data-act=newProj],.ro [data-act=dupProj],.ro [data-act=delProj],.ro [data-act=importProj],.ro [data-act=addScene],.ro [data-act=addShot],.ro [data-act=dupScene],.ro [data-act=delScene],.ro [data-act=addDay],.ro [data-act=dupDay],.ro [data-act=delDay],.ro [data-act=noteMenu],.ro [data-act=toggleLive],.ro [data-act=completeCur],.ro [data-act=resetDone],.ro [data-act=delShot],.ro [data-act=dupShot],.ro [data-act=exclShot],.ro [data-act=delNote],.ro [data-act=dupNote],.ro [data-act=stripAdd],.ro [data-act=stripRem],.ro [data-act=restore],.ro [data-act=boardUp],.ro [data-act=boardDel]{display:none!important}
@media (max-width:820px){.syncpill{padding:5px 8px}.syncpill span{display:none}}
#print{display:none}
@media print{
  #app,#modal,#toast{display:none!important}
  html,body{background:#fff;height:auto;color:#000}
  #print{display:block;color:#000;font:9.5pt/1.3 -apple-system,Helvetica,Arial,sans-serif}
  #print h1{font-size:16pt;margin:0 0 2pt}
  #print h2{font-size:11.5pt;margin:12pt 0 4pt;padding:4pt 6pt;background:#eee;border-radius:3pt;page-break-after:avoid}
  #print .sub{color:#555;margin-bottom:8pt}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border-bottom:.5pt solid #bbb;padding:3pt 4pt;text-align:left;vertical-align:top}
  #print th{font-size:7pt;text-transform:uppercase;color:#555;letter-spacing:.05em}
  #print tr{page-break-inside:avoid}
  #print .pn td{background:#f4efe3;font-style:italic}
  #print .pd td{color:#999;text-decoration:line-through}
  #print img{width:110px;border-radius:2pt}
  #print .b{font-weight:700}
}
@page{margin:11mm}

@media (max-width:820px){
  .side{width:100%;border-right:0}
  .main{display:none}
  .proj.show-main .side{display:none}
  .proj.show-main .main{display:block}
  .mob{display:inline-grid!important}
  .clocks{grid-template-columns:1fr 1fr}
  .clocks .donebtn{grid-column:1/-1;padding:12px;justify-content:center}
  .clock b{font-size:28px}
  .f3{grid-template-columns:1fr 1fr}
  .main{padding:10px 8px 90px}
  .row{gap:6px;padding:8px 8px 8px 0}
  .handle{width:22px}
  .when{width:42px;font-size:12px}
  .num{min-width:30px;font-size:14px}
  .nicon{min-width:30px}
  .mins{min-width:34px;font-size:13px}
  .lk{display:none}
  .chk{width:22px;height:22px}
  .chip{font-size:10px;padding:1px 5px}
  .t1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .t1 .d{display:none}
  .thumb{display:none}
  .pcard .pc-act{opacity:1}
}
</style>
</head>

<div id="print"></div>

<input type="file" id="fImp" accept=".json,.shotday,application/json" hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<script>
'use strict';

const KEY='shotday.v1';

function fmtT(d){const r=Math.round(d),a=Math.abs(r),s=r>0?'+':r<0?'−':'±';return `T${s}${a>=60?Math.floor(a/60)+':'+pad(a%60):pad(a)}`}
function dateParts(ds){if(!ds)return{w:'—',d:'',m:'',long:'No date'};const d=new Date(ds+'T12:00:00');return{w:d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase(),d:d.getDate(),m:d.toLocaleDateString(undefined,{month:'short'}).toUpperCase(),long:d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}}
function letter(i,skip){const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(c=>!skip||(c!=='I'&&c!=='O'));let s='';i++;while(i>0){i--;s=L[i%L.length]+s;i=Math.floor(i/L.length)}return s}

const LIST_NAMES={size:'Shot Sizes',angle:'Angles',move:'Movements',lens:'Lenses',gear:'Gear',camera:'Cameras',user:'User Category'};
function defSettings(){return{vis:Object.fromEntries(CATS.map(c=>[c[0],!['cast','user'].includes(c[0])])),lists:JSON.parse(JSON.stringify(DEF_LISTS)),userLabel:'Priority',defMins:10,skipIO:true}}
function newProject(name){return{id:uid(),name,created:Date.now(),updated:Date.now(),scenes:[],days:[],settings:defSettings()}}
function newScene(p){const nums=p.scenes.map(s=>parseInt(s.number)||0);return{id:uid(),number:String((nums.length?Math.max(...nums):0)+1),ie:'INT',loc:'',tod:'DAY',pages:'',cast:'',synopsis:'',shots:[]}}
function newShot(p,prev){return{id:uid(),num:'',name:'',desc:'',size:'',angle:'',move:'',lens:prev?.lens||'',setup:prev?.setup??1,camera:prev?.camera||'A',gear:[],user:'',flag:false,color:'',mins:+p.settings.defMins||10,link:false,cast:'',notes:'',board:''}}
function newDay(p){const last=[...p.days].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).pop();let date=todayStr();if(last&&last.date){const d=new Date(last.date+'T12:00:00');d.setDate(d.getDate()+1);date=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
 return{id:uid(),date,name:'Day '+(p.days.length+1),call:'07:00',lunch:'13:00',wrap:'19:00',sceneIds:[],items:[],excluded:[],done:{},live:null}}

function sceneHead(sc){return `${sc.ie?sc.ie+'. ':''}${sc.loc||'Untitled location'}${sc.tod?' – '+sc.tod:''}`}
function stripColor(sc){const night=/NIGHT|DUSK|EVENING/i.test(sc.tod||''),ext=/EXT/i.test(sc.ie||'');return ext?(night?'#30d158':'#ffd60a'):(night?'#64a8ff':'#f2f2f2')}
function shotNum(p,sc,i){const s=sc.shots[i];return s.num||(sc.number+letter(i,p.settings.skipIO))}
function shotIndex(p){const m={};p.scenes.forEach(sc=>sc.shots.forEach((shot,i)=>m[shot.id]={shot,scene:sc,i}));return m}
function groupsOf(arr,isLinked,canJoin=()=>true){const out=[];let cur=null;arr.forEach(x=>{if(cur&&cur.open&&canJoin(x))cur.items.push(x);else{cur={items:[x]};out.push(cur)}cur.open=isLinked(x)});return out}
function sceneMins(sc){return groupsOf(sc.shots,s=>s.link).reduce((a,g)=>a+Math.max(...g.items.map(s=>+s.mins||0)),0)}

/* shoot-day sync + plan */
function syncDay(p,day){
 const idx=shotIndex(p);day.excluded=day.excluded||[];day.done=day.done||{};
 day.sceneIds=day.sceneIds.filter(id=>p.scenes.some(s=>s.id===id));
 day.items=day.items.filter(it=>it.t==='note'||(idx[it.id]&&day.sceneIds.includes(idx[it.id].scene.id)&&!day.excluded.includes(it.id)));
 for(const sid of day.sceneIds){const sc=p.scenes.find(s=>s.id===sid);
  for(const sh of sc.shots){if(day.excluded.includes(sh.id)||day.items.some(it=>it.id===sh.id))continue;
   let at=-1;day.items.forEach((it,k)=>{if(it.t==='shot'&&idx[it.id].scene.id===sid)at=k});
   if(at<0)day.items.push({t:'shot',id:sh.id});else day.items.splice(at+1,0,{t:'shot',id:sh.id})}}
}
function rebuildByScenes(p,day){
 const idx=shotIndex(p);const before={};let pend=[];
 day.items.forEach(it=>{if(it.t==='note')pend.push(it);else{before[it.id]=pend;pend=[]}});
 const out=[];
 for(const sid of day.sceneIds){const shotsHere=day.items.filter(it=>it.t==='shot'&&idx[it.id]?.scene.id===sid);
  shotsHere.forEach(it=>{out.push(...(before[it.id]||[]),it)})}
 out.push(...pend);
 day.items.forEach(it=>{if(!out.includes(it))out.push(it)});
 day.items=out;
}
function dayPlan(p,day){
 syncDay(p,day);const idx=shotIndex(p);
 const call=toMin(day.call);let wrap=toMin(day.wrap);if(wrap<=call)wrap+=1440;
 const rows=day.items.map(it=>{const info=it.t==='shot'?idx[it.id]:null;return{it,info,key:it.id,mins:it.t==='shot'?(+info.shot.mins||0):(+it.mins||0)}});
 const groups=groupsOf(rows,r=>r.it.t==='shot'&&r.info.shot.link,r=>r.it.t==='shot');
 let t=call;
 groups.forEach(g=>{g.mins=Math.max(0,...g.items.map(r=>r.mins));g.start=t;g.end=t+g.mins;t=g.end;g.done=g.items.every(r=>day.done[r.key]!=null)});
 return{groups,call,wrap,end:t,used:t-call,avail:wrap-call,lunch:day.lunch?toMin(day.lunch)+(toMin(day.lunch)<call?1440:0):null};
}
function nowFor(plan){const d=new Date();let n=d.getHours()*60+d.getMinutes()+d.getSeconds()/60+(+S.offset||0);if(plan&&plan.wrap>1440&&n<plan.call-180)n+=1440;return n}
function isLive(day,plan){if(day.live===true)return true;if(day.live===false)return false;const n=nowFor(plan);return day.date===todayStr()&&n>=plan.call&&n<=plan.wrap+180}
function liveInfo(day,plan){
 const now=nowFor(plan);
 const doneVals=Object.values(day.done).filter(v=>typeof v==='number');
 const lastDone=Math.max(plan.call,...doneVals);
 const ci=plan.groups.findIndex(g=>!g.done);
 if(ci<0)return{now,finished:true,wrapAt:lastDone,wrapT:lastDone-plan.wrap};
 const cur=plan.groups[ci];
 const startedAt=Math.max(plan.call,lastDone);
 const elapsed=Math.max(0,now-startedAt);
 const rem=Math.max(0,cur.mins-elapsed);
 const base=Math.max(now,plan.call);
 const proj={};let t=base+rem;proj[ci]=Math.min(startedAt,base);
 for(let k=ci+1;k<plan.groups.length;k++){const g=plan.groups[k];if(g.done)continue;proj[k]=t;t+=g.mins}
 return{now,ci,cur,pre:now<plan.call,shotT:now-cur.end,wrapAt:t,wrapT:t-plan.wrap,proj,elapsed};
}

function viewHome(){
 const cards=S.projects.map(p=>{const shots=p.scenes.reduce((a,s)=>a+s.shots.length,0);
  const bars=p.scenes.slice(0,24).map(s=>`<i style="height:${Math.min(36,8+s.shots.length*5)}px;background:${stripColor(s)}"></i>`).join('');
  return `<div class="pcard" data-act="openProj" data-id="${p.id}" role="button" tabindex="0">
   <div class="pc-art">${bars}</div>
   <h3>${esc(p.name)}${Sync.on()&&SY.localOnly[p.id]?'<span class="tagdev">This device only</span>':''}</h3>
   <div class="meta">${p.scenes.length} scenes · ${shots} shots · ${p.days.length} shoot days</div>

/* ============ drag to reorder ============ */
let dragging=false,justDragged=0;
function sortable(box){
 box.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const h=e.target.closest('.handle');if(!h||!box.contains(h))return;
  const g=h.closest('.grp');if(!g||g.parentElement!==box)return;
  e.preventDefault();
  const r=g.getBoundingClientRect(),off=e.clientY-r.top;
  const ph=document.createElement('div');ph.className='ph';ph.style.height=r.height+'px';g.after(ph);
  Object.assign(g.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',zIndex:60,pointerEvents:'none'});g.classList.add('lift');
  dragging=true;document.body.classList.add('dragging');
  const scroller=box.closest('.main,.slist,.sheet-body')||document.scrollingElement;
  let y=e.clientY,raf;
  const place=()=>{const sibs=[...box.children].filter(c=>c!==g&&c!==ph&&c.classList.contains('grp'));let before=null;
   for(const s of sibs){const sr=s.getBoundingClientRect();if(y<sr.top+sr.height/2){before=s;break}}
   if(before){if(ph.nextElementSibling!==before)box.insertBefore(ph,before)}else if(sibs.length){const last=sibs[sibs.length-1];if(last.nextElementSibling!==ph)last.after(ph)}};
  const loop=()=>{const sr=scroller.getBoundingClientRect();if(y<sr.top+50)scroller.scrollTop-=10;else if(y>sr.bottom-50)scroller.scrollTop+=10;place();raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  const mv=ev=>{y=ev.clientY;g.style.top=(ev.clientY-off)+'px'};
  const up=()=>{cancelAnimationFrame(raf);removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
   ph.replaceWith(g);g.removeAttribute('style');g.classList.remove('lift');dragging=false;document.body.classList.remove('dragging');justDragged=Date.now();
   commitOrder(box.dataset.sort,[...box.querySelectorAll('[data-key]')].map(x=>x.dataset.key))};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
 });
}
function commitOrder(kind,keys){
 const p=P(),reorder=(arr,get)=>{const m=new Map(arr.map(x=>[get(x),x]));const out=keys.map(k=>m.get(k)).filter(Boolean);arr.forEach(x=>{if(!out.includes(x))out.push(x)});return out};
 if(kind==='scenes')p.scenes=reorder(p.scenes,s=>s.id);
 else if(kind==='shots'){const sc=SC();sc.shots=reorder(sc.shots,s=>s.id)}
 else if(kind==='day'){const d=DY();d.items=reorder(d.items,i=>i.id)}
 else if(kind==='strip'){const d=DY();d.sceneIds=reorder(d.sceneIds,i=>i);rebuildByScenes(p,d);renderModal()}
 touch();renderApp();
}

/* ============ crew sync (Google Drive via Apps Script) ============ */
const RO_OK=new Set(['home','openProj','tab','pane','view','selScene','selDay','gotoDay','closeModal','export','exp','editShot','editNote','strip','settings','syncPanel','syncConnect','syncDisconnect','copyLink']);
let needsRender=false;
const isTyping=()=>{const a=document.activeElement;return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))};
function softRender(){if(dragging||isTyping()){needsRender=true;return}renderApp();if(M)renderModal()}
function applyRole(){document.body.classList.toggle('ro',Sync.ro())}
function syncCall(q){
 q=Object.assign({},q,{code:SY.code});
 if(HOSTED)return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(q));
 return fetch(SY.url,{method:'POST',body:JSON.stringify(q),credentials:'omit'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
}
/* three-way merge: keeps both your edits and other editors' edits to the same project */
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const same=(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b);
const idArr=a=>Array.isArray(a)&&a.length>0&&a.every(x=>isObj(x)&&typeof x.id==='string');
function merge3(base,mine,theirs){
 if(same(mine,base))return theirs;
 if(same(theirs,base)||same(mine,theirs))return mine;
 if(isObj(mine)&&isObj(theirs)){
  const b=isObj(base)?base:{},out={};
  new Set([...Object.keys(b),...Object.keys(theirs),...Object.keys(mine)]).forEach(k=>{const v=merge3(b[k],mine[k],theirs[k]);if(v!==undefined)out[k]=v});
  return out;
 }
 if(Array.isArray(mine)&&Array.isArray(theirs)&&(idArr(mine)||idArr(theirs)||idArr(base))){
  const b=Array.isArray(base)?base:[],bm=new Map(b.map(x=>[x.id,x])),mm=new Map(mine.map(x=>[x.id,x])),tm=new Map(theirs.map(x=>[x.id,x]));
  const mineMoved=!same(b.map(x=>x.id).filter(id=>mm.has(id)),mine.map(x=>x.id).filter(id=>bm.has(id)));
  const lead=mineMoved?mine:theirs,other=mineMoved?theirs:mine;
  const order=lead.map(x=>x.id);
  other.forEach((x,i)=>{if(order.includes(x.id)||bm.has(x.id))return;const prev=i>0?other[i-1].id:null;order.splice(prev?order.indexOf(prev)+1:0,0,x.id)});
  return order.filter(id=>!(bm.has(id)&&(!mm.has(id)||!tm.has(id)))).map(id=>{const m=mm.get(id),t=tm.get(id);return m&&t?merge3(bm.get(id),m,t):(m||t)});
 }
 return mine;
}
const Sync={
 state:'off',msg:'',bases:{},pending:new Set(),pushing:false,timer:null,pt:null,
 on(){return syncConfigured()},
 can(){return this.on()&&SY.role==='edit'},
 ro(){return this.on()&&SY.role==='view'},
 status(s,msg=''){this.state=s;this.msg=msg;document.querySelectorAll('.syncpill').forEach(e=>e.outerHTML=syncPill())},
 async start(){
  clearInterval(this.timer);applyRole();
  if(!this.on()){this.status('off');return}
  this.status('connecting');
  try{
   const r=await syncCall({a:'hello'});
   if(r.error){this.status('error',r.error==='bad_code'?'That code was not accepted. Check the link or code.':r.error);if(M&&M.type==='sync')renderModal();return}
   SY.role=r.role;SY.links=r.links?pageLinks(r.links):null;persistSync();applyRole();render();
   await this.pull(true);
  }catch(e){this.status('offline',"Can't reach the crew server. Changes are kept on this device.")}
  this.timer=setInterval(()=>{if(!document.hidden)this.pull()},4000);
  if(M&&M.type==='sync')renderModal();
 },
 dirty(pid){
  if(!this.can()||SY.localOnly[pid])return;
  SY.dirty[pid]=1;persistSync();this.pending.add(pid);
  clearTimeout(this.pt);this.pt=setTimeout(()=>this.flush(),600);
  if(this.state!=='saving')this.status('saving');
 },
 async remove(pid){
  delete SY.dirty[pid];this.pending.delete(pid);
  if(!this.can()||SY.localOnly[pid]){delete SY.localOnly[pid];persistSync();return}
  try{const r=await syncCall({a:'delete',id:pid});if(r.error)throw new Error(r.error);delete SY.vers[pid];persistSync()}
  catch(e){toast("Couldn't delete it on the crew server. It may come back on other devices.")}
 },
 async flush(){
  if(this.pushing)return;this.pushing=true;
  try{
   while(this.pending.size){const pid=[...this.pending][0];this.pending.delete(pid);await this.push(pid)}
   this.status('ok');
  }catch(e){
   Object.keys(SY.dirty).forEach(id=>this.pending.add(id));
   this.status(String(e.message)==='read_only'?'error':'offline',String(e.message)==='read_only'?'This code is view only.':"Can't reach the crew server. Your changes will upload when it's back.");
  }
  this.pushing=false;
 },
 async push(pid){
  const p=S.projects.find(x=>x.id===pid);if(!p){delete SY.dirty[pid];return}
  const sent=JSON.stringify(p);
  const r=await syncCall({a:'save',project:JSON.parse(sent),base:SY.vers[pid]||0});
  if(r.ok){
   SY.vers[pid]=r.ver;this.bases[pid]=sent;
   const now=S.projects.find(x=>x.id===pid);
   if(now&&JSON.stringify(now)!==sent)this.pending.add(pid);else delete SY.dirty[pid];
   persistSync();
  }else if(r.conflict){
   this.mergeIn(pid,r.data,r.ver);this.pending.add(pid);save();softRender();
  }else if(r.deleted){
   S.projects=S.projects.filter(x=>x.id!==pid);delete SY.dirty[pid];delete SY.vers[pid];persistSync();save();softRender();
   toast('That project was deleted by another editor');
  }else throw new Error(r.error||'save_failed');
 },
 mergeIn(pid,remote,ver){
  const i=S.projects.findIndex(x=>x.id===pid);
  if(i<0)S.projects.push(remote);
  else if(!SY.dirty[pid])S.projects[i]=remote;
  else{const base=this.bases[pid]?JSON.parse(this.bases[pid]):remote;S.projects[i]=merge3(base,S.projects[i],remote)}
  SY.vers[pid]=ver;this.bases[pid]=JSON.stringify(remote);
 },
 async pull(first){
  if(this.pushing||this.pending.size||dragging)return;
  const wasFresh=Object.keys(SY.vers).length===0;
  let r;
  try{r=await syncCall({a:'pull',vers:SY.vers})}catch(e){this.status('offline',"Can't reach the crew server.");return}
  if(r.error){this.status('error',r.error==='bad_code'?'That code was not accepted.':r.error);return}
  if(this.pushing||this.pending.size)return;
  let changed=false;
  Object.keys(r.projects||{}).forEach(pid=>{if(SY.localOnly[pid])return;this.mergeIn(pid,r.projects[pid].data,r.projects[pid].ver);if(SY.dirty[pid])this.pending.add(pid);changed=true});
  (r.deleted||[]).forEach(pid=>{S.projects=S.projects.filter(x=>x.id!==pid);delete SY.vers[pid];delete SY.dirty[pid];changed=true});
  if(first&&this.can()){
   const local=S.projects.filter(p=>SY.vers[p.id]==null&&!SY.localOnly[p.id]);
   if(local.length){
    const names=local.map(p=>'• '+p.name).join('\n');
    if(!wasFresh||confirm(`Share ${local.length} project${local.length>1?'s':''} from this device with your crew?\n\n${names}\n\nCancel keeps ${local.length>1?'them':'it'} on this device only.`))local.forEach(p=>{SY.dirty[p.id]=1;this.pending.add(p.id)});
    else local.forEach(p=>SY.localOnly[p.id]=1);
    changed=true;
   }
  }
  if(first&&!this.can())S.projects.forEach(p=>{if(SY.vers[p.id]==null&&!SY.localOnly[p.id]){SY.localOnly[p.id]=1;changed=true}});
  persistSync();
  if(changed){save();softRender()}
  if(this.pending.size)this.flush();else this.status('ok');
 },
};
function pageLinks(L){if(!WEBPAGE)return L;const base=location.origin+location.pathname,k=u=>new URL(u).searchParams.get('k');return{edit:base+'?k='+k(L.edit),view:base+'?k='+k(L.view)}}
function syncPill(){
 const s=Sync.on()?Sync.state:'off';
 const map={off:['','Crew Sync'],connecting:['wait','Connecting…'],ok:['ok',SY.role==='view'?'Live · View only':'Live · Synced'],saving:['wait','Saving…'],offline:['bad','Offline'],error:['bad','Sync problem']};
 const [c,t]=map[s]||map.off;
 return `<button class="syncpill ${c}" data-act="syncPanel" title="${esc(Sync.msg||'Crew Sync')}"><i></i><span>${t}</span></button>`;
}
function mSync(){
 const on=Sync.on(),L=SY.links;
 const link=(label,url,hint)=>`<div class="f"><span>${label}</span><div class="linkrow"><input readonly value="${esc(url)}"><button class="btn" data-act="copyLink" data-v="${esc(url)}">Copy</button></div><span class="hint" style="text-transform:none;letter-spacing:0;font-weight:500">${hint}</span></div>`;
 const roleTxt=SY.role==='edit'?'You can edit. Every change uploads to your Google Drive and reaches the crew within a few seconds.':SY.role==='view'?'View only. Changes from your editors appear here within a few seconds.':'';
 return hd('Crew Sync','Live updates through your Google Drive')+`<div class="sheet-body">
  ${on?`<div class="f"><span>Status</span><div class="hrow">${syncPill()}<span class="hint">${esc(Sync.msg||roleTxt)}</span></div></div>`:`<div class="hint" style="margin-bottom:14px">Crew Sync keeps your projects in a <b>Shotday Sync</b> folder in your Google Drive. Your crew opens a link on any phone or laptop and sees every change within a few seconds — no accounts needed. See <b>crew-sync/SETUP.md</b> to set up your server (about 5 minutes).</div>`}
  ${L?link('Crew link — view only',L.view,'Send this to your crew. They follow along live but can’t change anything.')+link('Editor link',L.edit,'Only for people who should change the schedule, like your 1st AD. Anyone with this link can edit.'):''}
  ${HOSTED||WEBPAGE?'':`<label class="f"><span>Crew server address</span><input id="syUrl" value="${esc(SY.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>`}
  <label class="f"><span>Code</span><input id="syCode" value="${esc(SY.code)}" placeholder="Your editor or crew code" autocomplete="off"></label>
 </div><div class="sheet-ft">${on?`<button class="btn danger" data-act="syncDisconnect">Disconnect this device</button>`:''}<div class="sp"></div><button class="btn pri" data-act="syncConnect">${on?'Reconnect':'Connect'}</button></div>`;
}
Object.assign(A,{
 syncPanel(){M={type:'sync'};renderModal()},
 syncConnect(){
  const u=$('#syUrl'),c=$('#syCode');
  const url=u?u.value.trim():'',code=(c?c.value:'').trim();
  if(!HOSTED&&!WEBPAGE&&!/^https?:\/\//.test(url)){toast('Paste the web app address from Google Apps Script');return}
  if(!code){toast('Enter your code');return}
  if(!HOSTED&&!WEBPAGE)SY.url=url;
  if(code!==SY.code){SY.role=null;SY.links=null}
  SY.code=code;persistSync();Sync.start();
 },
 syncDisconnect(){
  if(!confirm('Stop syncing on this device? Your projects stay on this device.'))return;
  clearInterval(Sync.timer);Sync.pending.clear();
  SY=Object.assign(SY,{code:'',role:null,vers:{},dirty:{},localOnly:{},links:null});persistSync();
  Sync.status('off');applyRole();render();
 },
 copyLink(el){const v=el.dataset.v;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Link copied')).catch(()=>prompt('Copy this link:',v))},
});

/* ============ events ============ */
document.addEventListener('click',e=>{
 if(Date.now()-justDragged<250)return;
 if(e.target.closest('.handle'))return;
 const el=e.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act,fn=A[act];if(!fn)return;e.stopPropagation();
 if(Sync.ro()&&!RO_OK.has(act)){toast('View only — your editors make the changes');return}
 fn(el,e)
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&M){A.closeModal();return}

});
function bind(el,commit){
 const[k,f]=el.dataset.b.split(':');const p=P();
 if(Sync.ro()&&k!=='g'){if(commit)render();return}
 const o={proj:p,scene:SC(),day:DY(),shot:curShot()?.shot,note:curNote(),set:p?.settings,vis:p?.settings.vis,lists:p?.settings.lists,g:S}[k];if(!o)return;
 let v=el.type==='checkbox'?el.checked:el.value;
 if(el.type==='number')v=v===''?'':+v;
 if(k==='lists'){if(!commit)return;v=el.value.split('\n').map(s=>s.trim()).filter(Boolean);if(!v.length)return}
 if(k==='scene'&&f==='loc')v=v.toUpperCase();
 o[f]=v;touch();
 if(commit){if(M){renderApp();if(M.type==='settings'&&(k==='vis'||k==='g'))renderModal()}else queueApp()}
}
let rq;function queueApp(){clearTimeout(rq);rq=setTimeout(()=>{const a=document.activeElement,b=a&&a.dataset&&a.dataset.b;let ss,se;try{ss=a.selectionStart;se=a.selectionEnd}catch(_){}
 renderApp();if(b){const n=document.querySelector(`#app [data-b="${b}"]`);if(n){n.focus();try{n.setSelectionRange(ss,se)}catch(_){}}}},0)}
document.addEventListener('input',e=>{if(e.target.dataset?.b)bind(e.target,false)});
document.addEventListener('change',e=>{if(e.target.dataset?.b)bind(e.target,true)});
async function readImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,720/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=r.result};r.readAsDataURL(file)})}
$('#fImg').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';const x=curShot();if(!f||!x||Sync.ro())return;x.shot.board=await readImg(f);refresh()});
document.addEventListener('paste',async e=>{if(!M||M.type!=='shot'||Sync.ro())return;const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(!it)return;e.preventDefault();curShot().shot.board=await readImg(it.getAsFile());refresh();toast('Storyboard added')});
$('#fImp').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const p=j.project||j;if(!p||!Array.isArray(p.scenes))throw 0;
 p.id=uid();p.settings=Object.assign(defSettings(),p.settings||{});p.days=p.days||[];p.updated=Date.now();
 if(S.projects.some(x=>x.name===p.name))p.name+=' (imported)';S.projects.unshift(p);M=null;save();A.openProj({dataset:{id:p.id}});Sync.dirty(p.id);toast('Project imported')}catch(_){alert('That file is not a Shotday project.')}};r.readAsText(f)});

let tick=0;
setInterval(()=>{tick++;
 if(needsRender&&!dragging&&!isTyping()){needsRender=false;renderApp();if(M)renderModal()}
 if(S.ui.view!=='project'||S.ui.tab!=='days'||dragging)return;const p=P(),d=DY();if(!p||!d)return;
